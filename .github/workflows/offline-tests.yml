name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install framework
        run: python -m pip install -e .

      - name: Run offline tests
        run: |
          mkdir -p reports
          python -m pytest -m offline -v --html=reports/offline.html --self-contained-html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-report
          path: reports/offline.html
          if-no-files-found: warn
